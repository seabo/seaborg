[package]
name = "engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Linking the promoted NNUE network into the binary is on by default, so a fresh
# clone builds a full-strength engine with no operator setup. Turning it off
# builds an engine that evaluates with the hand-crafted evaluation, which is how
# the network's contribution is measured and how a build avoids carrying ~400 KB
# of weights it does not want.
[features]
default = ["embedded-net"]
embedded-net = []
# Off-by-default search selectivity instrumentation. When disabled (the shipped
# default) the counters, their hot-loop increment sites, and the summary
# emission compile out entirely, so the engine's behaviour and speed are
# unchanged. Enabling it accumulates per-node selectivity statistics (cutoff
# move index, LMR re-search and reduction distribution, PV/non-PV and aspiration
# re-search rates, quiescence widening, TT-move availability) and emits them as a
# final `info string selstats {json}` line for offline analysis.
selstats = []

[dependencies]
chess = { path = "../chess" }
crossbeam-channel = "0.5.16"
separator.workspace = true
open = "5.4.0"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rand.workspace = true
